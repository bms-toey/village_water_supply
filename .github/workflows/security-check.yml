name: Security and ISO readiness checks

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  security-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ''
      - name: Run repository security gate
        run: npm run check
